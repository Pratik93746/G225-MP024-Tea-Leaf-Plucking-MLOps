apiVersion: v1
kind: Service
metadata:
  name: mp024-svc
  labels:
    app: mp024-api
spec:
  type: ClusterIP
  selector:
    app: mp024-api          # must match the pod labels in deployment.yaml
  ports:
    - name: http
      port: 80              # what clients call
      targetPort: 8000      # what the container listens on
