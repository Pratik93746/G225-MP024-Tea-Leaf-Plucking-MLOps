apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp024-api
  labels:
    app: mp024-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mp024-api
  template:
    metadata:
      labels:
        app: mp024-api
    spec:
      containers:
        - name: mp024-api
          image: mp024-api:1.0
          imagePullPolicy: IfNotPresent      # image is built locally (docker build -t mp024-api:1.0 .)
          ports:
            - containerPort: 8000
          readinessProbe:                    # "is this pod ready to get traffic?" - checked early and often
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:                     # "is this pod stuck?" - waits LONGER, so a slow start is not killed
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
